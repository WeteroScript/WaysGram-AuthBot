name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, fix/system-account-gift-notifications]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Check Termux launcher syntax
        run: bash -n scripts/run-termux.sh
      - name: Compile Python files
        run: python -m compileall -q bot.py messenger_api.py waysgram_observability.py tests
      - name: Run tests
        run: python -m pytest -q
